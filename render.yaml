services:
  - type: web
    name: health-in-hand-api
    runtime: go
    plan: free
    rootDir: backend

    buildCommand: go build -tags netgo -ldflags '-s -w' -o app ./cmd/api
    startCommand: ./app

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: GIN_MODE
        value: release
      - key: MONGO_DB_NAME
        value: fitness_app
      - key: READ_TIMEOUT
        value: 30s
      - key: WRITE_TIMEOUT
        value: 60s
      - key: IDLE_TIMEOUT
        value: 60s
      - key: MONGO_URI
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
